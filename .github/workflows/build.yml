name: Build Desktop App

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./desktop

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install

      - name: Build Windows target
        if: matrix.os == 'windows-latest'
        run: npm run dist

      - name: Build Linux targets
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux

      - name: Upload Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ryza-chat-linux
          if-no-files-found: error
          path: |
            output/desktop/*.AppImage
            output/desktop/*.deb

      - name: Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ryza-chat-windows
          if-no-files-found: error
          path: output/desktop/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ryza-chat-linux
          path: ./release-artifacts/linux

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ryza-chat-windows
          path: ./release-artifacts/windows

      - name: List downloaded files
        run: ls -R ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./release-artifacts/linux/*.AppImage
            ./release-artifacts/linux/*.deb
            ./release-artifacts/windows/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
